name: Web Quality Gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Clean install
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Quantitative zero-mock scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.next \
            -E 'a3f5c9e2d1b8f4a7c0e3b6d9f2a5c8e1d4b7a0f3c6e9b2d5a8f1c4e7b0d3a6f9|1672531200000|1704067200000|META-PORT-BTC-ETH-NQ-01|Math\.random\(' \
            apps/web services 2>/dev/null
