name: One-shot Lockfile Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[repair-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate package-lock from manifests
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        run: npm ci --ignore-scripts

      - name: Commit regenerated lockfile and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_repair-lock-once.yml
          if git diff --quiet -- package-lock.json; then
            git status --short
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/_repair-lock-once.yml
          git commit -m "fix(web): regenerate lockfile for cross-platform install"
          git push origin HEAD:main
