name: R0 Stabilization Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  r0-foundation:
    name: R0 foundation guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Clean npm install
        run: npm ci --ignore-scripts

      - name: Frozen Python install
        run: uv sync --frozen --extra dev

      - name: Verify dependency authority
        run: .venv/bin/python scripts/stabilization/r0_dependency_authority.py

      - name: Verify FastAPI route inventory
        run: .venv/bin/python scripts/stabilization/r0_route_inventory.py

      - name: Run focused stabilization tests
        run: .venv/bin/python -m pytest tests/stabilization/test_r0_dependency_authority.py tests/stabilization/test_r0_route_inventory.py -q
