name: R0 Stabilization Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  r0-dependency-authority:
    name: R0.1 dependency authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Verify dependency authority
        run: python scripts/stabilization/r0_dependency_authority.py

      - name: Clean npm install
        run: npm ci --ignore-scripts

      - name: Frozen Python install
        run: uv sync --frozen --extra dev

      - name: Run focused stabilization test
        run: .venv/bin/python -m pytest tests/stabilization/test_r0_dependency_authority.py -q
