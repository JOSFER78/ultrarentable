name: Phase 2 Blind OOS Certification

# Blind OOS is a separate, manual-only release step. It consumes only a frozen
# champion artifact from a completed research run and never performs selection.
on:
  workflow_dispatch:
    inputs:
      research_run_id:
        description: "GitHub Actions run id of the completed Phase-2 research campaign"
        required: true
        type: string
      freeze_file:
        description: "Frozen champion filename inside the research artifact"
        required: true
        type: string

concurrency:
  group: phase2-blind-oos
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  blind-oos:
    name: Frozen champion -> Blind OOS -> evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frozen Python install
        run: |
          python -m pip install --upgrade uv
          uv sync --frozen --extra dev

      - name: Download exact research-run artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.research_run_id }}
          name: phase2-real-research-${{ inputs.research_run_id }}
          path: data/research-source
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable freeze and dataset
        id: resolve
        env:
          FREEZE_FILE: ${{ inputs.freeze_file }}
        run: |
          set -euo pipefail
          freeze=$(find data/research-source -type f -name "$FREEZE_FILE" -print -quit)
          test -n "$freeze"
          dataset=$(dirname "$freeze")
          dataset_count=$(find "$dataset" -maxdepth 1 -type f -name 'ds_bingx_*.json' ! -name '*_manifest.json' | wc -l)
          test "$dataset_count" -gt 0
          echo "freeze=$freeze" >> "$GITHUB_OUTPUT"
          echo "dataset_dir=$dataset" >> "$GITHUB_OUTPUT"

      - name: Execute isolated Blind OOS
        run: |
          .venv/bin/python scripts/phase2_blind_oos.py \
            --freeze "${{ steps.resolve.outputs.freeze }}" \
            --data-dir "${{ steps.resolve.outputs.dataset_dir }}"

      - name: Upload Blind OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-blind-oos-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/phase2-evidence/*_blind_oos.json
