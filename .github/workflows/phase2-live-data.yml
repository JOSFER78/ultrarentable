name: Phase 2 Live Data + Research

# MANUAL ONLY: live data acquisition/research never runs on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days per symbol"
        required: false
        default: "365"
      interval:
        description: "BingX kline interval"
        required: false
        default: "1h"
      symbols:
        description: "Comma-separated symbols, or AUTO to resolve the real BingX universe"
        required: false
        default: "AUTO"
      max_trials_ultra:
        description: "Deterministic ULTRA trial budget per dataset"
        required: false
        default: "128"
      max_trials_fondeo:
        description: "Deterministic FONDEO trial budget per dataset"
        required: false
        default: "96"

concurrency:
  group: phase2-live-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acquire-and-research:
    name: Real data -> discovery -> validation -> blind OOS evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHASE2_HISTORY_DAYS: ${{ inputs.days || '365' }}
      PHASE2_INTERVAL: ${{ inputs.interval || '1h' }}
      PHASE2_SYMBOLS: ${{ inputs.symbols || 'AUTO' }}
      PHASE2_MAX_TRIALS_ULTRA: ${{ inputs.max_trials_ultra || '128' }}
      PHASE2_MAX_TRIALS_FONDEO: ${{ inputs.max_trials_fondeo || '96' }}
      PHASE2_MAX_DATASETS: "12"
      PHASE2_TOP_VALIDATION: "20"
      DATA_DIR: "data/phase2-live"
      PHASE2_DATA_DIR: "data/phase2-live/normalized"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean Node install
        run: npm ci

      - name: Frozen Python install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Live BingX smoke test
        env:
          RUN_LIVE_BINGX_TESTS: "1"
        run: npm run test:ingestion

      - name: Resolve real BingX research universe
        id: universe
        run: npx tsx scripts/resolve_phase2_universe.ts

      - name: Acquire real historical data
        env:
          PHASE2_SYMBOLS: ${{ steps.universe.outputs.symbols }}
        run: npx tsx scripts/sync_phase2_history.ts

      - name: Verify acquired data custody
        run: |
          test -n "$(find data/phase2-live/normalized -maxdepth 1 -type f -name 'ds_bingx_*.json' ! -name '*_manifest.json' -print -quit)"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          files = sorted(Path('data/phase2-live/normalized').glob('ds_bingx_*.json'))
          assert files, 'NO_NORMALIZED_DATASETS'
          for path in files:
              manifest_path = path.with_name(path.stem + '_manifest.json')
              manifest = json.loads(manifest_path.read_text())
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == manifest['physicalFileSha256'], path.name
              assert manifest['closedRecordsOnly'] is True
              assert manifest['completeHistory'] is True
              assert int(manifest['recordCount']) == len(json.loads(path.read_text()))
          print(f'PHASE2_DATA_CUSTODY: PASS ({len(files)} datasets)')
          PY

      - name: Canonical phase-2 research
        run: python scripts/phase2_research_adapter.py

      - name: Verify trial planner integration
        run: |
          python - <<'PY'
          from scripts.phase2_trial_planner import PLANNER_VERSION
          assert PLANNER_VERSION == 'phase2-stratified-v1'
          print('PHASE2_TRIAL_PLANNER: PASS')
          PY

      - name: Upload complete phase-2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase2-real-research-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/phase2-live/normalized/ds_bingx_*.json
            data/phase2-live/normalized/ds_bingx_*_manifest.json
            data/phase2-live/raw/rest/phase2-history/**
            data/phase2-live/phase2-evidence/**
            data/phase2-live/evidence/**
            data/phase2-evidence/**
            data/evidence/**