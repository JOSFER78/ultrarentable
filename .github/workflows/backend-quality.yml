name: Backend Quality Gate

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend + dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q services contracts tests

      - name: Phase 2 discovery integrity guard
        run: python scripts/stabilization/phase2_research_guard.py

      - name: Run tests
        run: pytest -q
