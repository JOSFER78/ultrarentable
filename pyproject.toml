[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bingx-ultra-strategy-lab"
version = "0.2.0"
description = "Local-first BingX research and backtesting lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "python-dotenv>=1.1,<2",
  "pandas>=2.3,<3",
  "pyarrow>=20,<21",
  "websockets>=15,<16"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "services/api/tests"]

[tool.ruff]
line-length = 100
