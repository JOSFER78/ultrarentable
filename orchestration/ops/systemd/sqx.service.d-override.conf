# Drop-in correctivo para sqx.service (StrategyQuantX headless)
#
# Instalar como: /etc/systemd/system/sqx.service.d/override.conf
#
# CONTEXTO: sqcli sostiene 113-116 % de CPU y 4,3 GB de RAM de forma continua, y el 2026-09-01
# llevaba 37 ciclos de build con "Aceptado: 0" — es decir, consumia la mitad de la maquina sin
# producir una sola estrategia utilizable, porque su configuracion apunta a un unico simbolo
# (AUDUSD_H1) con un OOS del 0,3 %. Mientras no se aplique la reconfiguracion documentada en
# orchestration/results/sqx_reconfiguracion_fondeo.md, este servicio es carga pura.

[Service]
CPUQuota=100%
CPUWeight=30
MemoryHigh=4.5G
MemoryMax=5.5G
MemorySwapMax=1G
IOWeight=30
