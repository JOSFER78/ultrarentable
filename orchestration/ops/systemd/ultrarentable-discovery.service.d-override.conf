# Drop-in correctivo para ultrarentable-discovery.service
#
# Instalar como:
#   /etc/systemd/system/ultrarentable-discovery.service.d/override.conf
#
# PROBLEMA QUE CORRIGE
# La unidad declaraba MemoryHigh=1.5G y el working set real del proceso es ~1.6G. MemoryHigh es un
# limite BLANDO: al superarlo, el kernel frena el proceso para forzar reclamo de memoria. Como el
# proceso vivia permanentemente por encima, entraba en un bucle: crece, lo frenan, reclama, vuelve
# a crecer. Medido el 2026-09-01 en memory.events: 713.626 frenazos, el proceso clavado en estado D
# con wchan=mem_cgroup_handle_over_high y 947 MB suyos en swap. Esa era la causa real de la presion
# de I/O sostenida del 13-15 %, no la CPU.
#
# Un limite blando por debajo del uso estable de un proceso no lo limita: lo convierte en un
# generador permanente de presion de disco que arrastra a toda la maquina.

[Service]
# Por encima del working set real: la valvula vuelve a ser una valvula y no un freno continuo.
MemoryHigh=2.5G
# Techo duro real. Si de verdad se desmadra, que lo mate el OOM del cgroup y Restart lo levante,
# en vez de degradar la maquina entera indefinidamente.
MemoryMax=3G
MemorySwapMax=512M

# 4 nucleos menos el 4-9 % que se lleva el hipervisor de Oracle, compartidos con la API, la web y
# StrategyQuantX. Este servicio no es prioritario mientras el foco sea FONDEO.
CPUQuota=30%
CPUWeight=20
IOWeight=20

# Que un reinicio en bucle no sea a su vez una fuente de carga.
RestartSec=60
